[project]
name = "sentinel"
version = "0.1.0"
description = "Personal autonomous agent army — Conductor + Claude Code + channels, approval-gated and self-learning."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.49",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
vision = ["openai>=1.75"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sentinel = "conductor.scheduler:main"

[tool.setuptools]
packages = ["config", "conductor", "brain", "approval", "channels", "learning", "coaching", "tools", "verticals", "discovery", "jobs", "memory", "research"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
